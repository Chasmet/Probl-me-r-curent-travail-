plugins {
    id 'com.android.application'
}
android {
    namespace 'fr.sync30.lesfaits'
    signingConfigs {
        stable {
            storeFile file(System.getenv('LF_SIGNING_STORE_FILE') ?: 'not-configured-release.p12')
            storePassword System.getenv('LF_SIGNING_PASSWORD') ?: ''
            keyAlias System.getenv('LF_SIGNING_ALIAS') ?: ''
            keyPassword System.getenv('LF_SIGNING_KEY_PASSWORD') ?: System.getenv('LF_SIGNING_PASSWORD') ?: ''
            storeType 'PKCS12'
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId 'fr.sync30.lesfaits'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.8.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LF_SIGNING_STORE_FILE') &&
                System.getenv('LF_SIGNING_PASSWORD') &&
                System.getenv('LF_SIGNING_ALIAS')) {
                signingConfig signingConfigs.stable
            }
        }
    }
}
