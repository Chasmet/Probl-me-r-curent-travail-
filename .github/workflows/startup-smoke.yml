name: Smoke test démarrage LES FAITS Android
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/startup-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Autoriser la virtualisation matérielle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et lancer LES FAITS sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 600
          script: bash .github/scripts/startup-smoke.sh
      - name: Conserver logcat et capture d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesfaits-launch-android-${{ matrix.api-level }}
          path: startup-artifacts/
          if-no-files-found: warn
