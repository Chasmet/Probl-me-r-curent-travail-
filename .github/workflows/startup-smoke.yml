name: Smoke test démarrage LES FAITS Android
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/startup-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Autoriser la virtualisation matérielle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et lancer LES FAITS sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop fr.sync30.lesfaits || true
            adb shell am start -W -n fr.sync30.lesfaits/.MainActivity
            sleep 8
            adb logcat -d -v time > /tmp/lesfaits-launch-logcat.txt
            if grep -A 25 -E 'FATAL EXCEPTION|Process: fr.sync30.lesfaits' /tmp/lesfaits-launch-logcat.txt; then
              echo 'ÉCHEC : crash Android détecté dans logcat'
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|mCurrentFocus|fr.sync30.lesfaits' | head -20
            adb shell pidof fr.sync30.lesfaits || { echo 'ÉCHEC : processus LES FAITS absent après lancement'; exit 1; }
            echo 'LES FAITS démarre et reste actif sur émulateur Android.'
