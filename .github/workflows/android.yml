name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK de test et bundle Play Store
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - name: APK à installer
        uses: actions/upload-artifact@v4
        with:
          name: les-faits-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Bundle non signé (signature Play requise)
        uses: actions/upload-artifact@v4
        with:
          name: les-faits-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation syntaxe et API
        run: |
          node --check server/api-server.mjs
          node --check server/mcp-server.mjs
          node --test server/api.test.mjs
