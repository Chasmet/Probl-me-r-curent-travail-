name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK de test et bundle Play Store
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - name: APK à installer
        uses: actions/upload-artifact@v4
        with:
          name: les-faits-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Bundle non signé (signature Play requise)
        uses: actions/upload-artifact@v4
        with:
          name: les-faits-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
